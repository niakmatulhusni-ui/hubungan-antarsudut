<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petualangan Sudut — Kuis Matematika Kelas 7</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{
    --biru:#3b82f6; --biru-tua:#1e40af; --kuning:#fbbf24; --hijau:#22c55e;
    --merah:#ef4444; --ungu:#8b5cf6; --pink:#ec4899; --oranye:#f97316;
    --bg1:#6d28d9; --bg2:#2563eb; --bg3:#06b6d4;
    --abu:#f1f5f9; --teks:#1e293b; --putih:#ffffff;
  }
  html,body{height:100%;}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,"Noto Sans",Arial,sans-serif;
    color:var(--teks); background:linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg3));
    min-height:100vh; padding:18px; line-height:1.55;
  }
  .wrap{max-width:880px;margin:0 auto;}

  /* ---------- Kartu umum ---------- */
  .card{
    background:var(--putih); border-radius:22px; padding:26px 26px 22px;
    box-shadow:0 18px 40px rgba(0,0,0,.28); margin-bottom:18px;
  }
  h1.judul{
    font-size:1.7rem; color:var(--putih); text-align:center; margin-bottom:6px;
    text-shadow:0 2px 6px rgba(0,0,0,.3); letter-spacing:.3px;
  }
  .subjudul{ text-align:center; color:#e0e7ff; margin-bottom:18px; font-size:1rem; }

  /* ---------- Layar identitas ---------- */
  .id-hero{ text-align:center; padding:10px 0 6px;}
  .id-hero .emoji{ font-size:3.2rem; }
  .id-hero h2{ color:var(--biru-tua); margin-top:6px; font-size:1.4rem;}
  .id-hero p{ color:#475569; margin-top:6px;}
  .form-grup{ margin:14px 0; }
  .form-grup label{ display:block; font-weight:600; margin-bottom:6px; color:#334155;}
  .form-grup input, .form-grup select{
    width:100%; padding:13px 14px; border:2px solid #cbd5e1; border-radius:12px;
    font-size:1rem; transition:.15s; background:#fff;
  }
  .form-grup input:focus, .form-grup select:focus{
    outline:none; border-color:var(--biru); box-shadow:0 0 0 4px rgba(59,130,246,.18);
  }
  .err-id{ color:var(--merah); font-size:.85rem; min-height:18px; text-align:center; margin-top:8px;}

  /* ---------- Tombol ---------- */
  .btn{
    border:none; cursor:pointer; font-weight:700; border-radius:14px;
    padding:13px 22px; font-size:1rem; transition:transform .08s, filter .15s, background .15s;
    color:#fff; display:inline-flex; align-items:center; gap:8px;
  }
  .btn:active{ transform:translateY(1px) scale(.99);}
  .btn-biru{ background:var(--biru);} .btn-biru:hover{ filter:brightness(1.08);}
  .btn-hijau{ background:var(--hijau);} .btn-hijau:hover{ filter:brightness(1.07);}
  .btn-ungu{ background:var(--ungu);} .btn-ungu:hover{ filter:brightness(1.08);}
  .btn-abu{ background:#94a3b8;} .btn-abu:hover{ filter:brightness(1.05);}
  .btn:disabled{ background:#cbd5e1 !important; color:#fff; cursor:not-allowed; filter:none;}
  .btn-ghost{ background:transparent; border:2px solid #cbd5e1; color:#475569;}
  .btn-ghost:hover{ background:#f8fafc;}

  /* ---------- Progress ---------- */
  .progress-wrap{ background:#e2e8f0; border-radius:999px; height:16px; overflow:hidden; margin-bottom:6px;}
  .progress-bar{ height:100%; width:0; background:linear-gradient(90deg,var(--kuning),var(--oranye),var(--merah)); transition:width .4s ease;}
  .progress-meta{ display:flex; justify-content:space-between; font-size:.85rem; color:#64748b; margin-bottom:14px;}

  /* ---------- Soal ---------- */
  .soal-no{
    display:inline-block; background:var(--ungu); color:#fff; font-weight:800;
    padding:4px 14px; border-radius:999px; font-size:.95rem; margin-bottom:8px;
  }
  .soal-topik{ color:#64748b; font-size:.85rem; margin-bottom:10px;}
  .soal-perintah{ font-weight:700; color:var(--biru-tua); margin-bottom:12px; font-size:1.05rem;}
  .figbox{
    background:#f8fafc; border:2px dashed #cbd5e1; border-radius:16px; padding:12px;
    text-align:center; margin-bottom:14px;
  }
  .figbox svg{ max-width:100%; height:auto; }
  .figimg{ max-width:100%; height:auto; max-height:300px; border-radius:10px; display:block; margin:0 auto; }

  .part{ background:#f1f5f9; border-radius:14px; padding:14px 14px 8px; margin-bottom:12px;}
  .part-q{ font-weight:600; margin-bottom:10px; color:#1e293b;}
  .part-q .tag{
    display:inline-block; background:var(--pink); color:#fff; font-size:.72rem; font-weight:700;
    padding:2px 8px; border-radius:999px; margin-right:8px; vertical-align:middle;
  }
  .tag.isian{ background:var(--biru);} .tag.pg{ background:var(--ungu);}
  .tag.slider{ background:var(--oranye);} .tag.bs{ background:var(--hijau);}
  .tag.cocok{ background:#0ea5e9;}

  /* pilihan ganda */
  .opsi{ display:flex; flex-direction:column; gap:8px; }
  .opsi label{
    display:flex; align-items:center; gap:10px; background:#fff; border:2px solid #e2e8f0;
    padding:10px 12px; border-radius:10px; cursor:pointer; transition:.12s;
  }
  .opsi label:hover{ border-color:var(--biru); background:#eff6ff;}
  .opsi input{ accent-color:var(--biru); width:18px; height:18px;}
  .opsi label.terpilih{ border-color:var(--biru); background:#eff6ff;}
  .opsi label.blok{ cursor:default;}

  /* isian */
  input.isian-in{
    width:120px; padding:10px 12px; border:2px solid #cbd5e1; border-radius:10px; font-size:1.1rem; text-align:center;
  }
  input.isian-in:focus{ outline:none; border-color:var(--biru); box-shadow:0 0 0 4px rgba(59,130,246,.18);}
  .satuan{ font-weight:600; color:#64748b; margin-left:4px;}

  /* slider */
  .slider-wrap{ display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  input[type=range]{
    -webkit-appearance:none; appearance:none; width:240px; height:10px; border-radius:999px;
    background:linear-gradient(90deg,#fde68a,#f97316); outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:26px; height:26px; border-radius:50%;
    background:var(--ungu); border:3px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.3); cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:26px; height:26px; border-radius:50%; background:var(--ungu); border:3px solid #fff; cursor:pointer;
  }
  .slider-val{ font-size:1.4rem; font-weight:800; color:var(--ungu); min-width:60px; text-align:center;}

  /* benar/salah */
  .bs-wrap{ display:flex; gap:10px; flex-wrap:wrap;}
  .bs-btn{
    flex:1; min-width:120px; padding:12px; border:2px solid #e2e8f0; background:#fff; border-radius:10px;
    cursor:pointer; font-weight:700; font-size:1rem; transition:.12s;
  }
  .bs-btn:hover{ border-color:var(--biru);}
  .bs-btn.terpilih{ border-color:var(--biru); background:#eff6ff; color:var(--biru-tua);}
  .bs-btn.blok{ cursor:default;}

  /* matching */
  .cocok-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:6px;}
  .cocok-col h4{ font-size:.85rem; color:#64748b; margin-bottom:8px; text-transform:uppercase; letter-spacing:.5px;}
  .cocok-item{
    background:#fff; border:2px solid #e2e8f0; border-radius:10px; padding:10px 12px; margin-bottom:8px;
    cursor:pointer; transition:.12s; font-size:.92rem;
  }
  .cocok-item:hover{ border-color:var(--biru);}
  .cocok-item.sel-kiri{ background:#dbeafe; border-color:var(--biru);}
  .cocok-item.sel-kanan{ background:#dcfce7; border-color:var(--hijau);}
  .cocok-item.blok{ cursor:default;}
  .cocok-item.terkunci-benar{ background:#dcfce7; border-color:var(--hijau); cursor:default;}
  .cocok-item.terkunci-salah{ background:#fee2e2; border-color:var(--merah); cursor:default;}
  .cocok-status{ font-size:.8rem; color:#64748b; margin-top:6px;}

  /* feedback */
  .fb{
    margin-top:10px; padding:12px 14px; border-radius:12px; font-weight:600; font-size:.95rem;
    display:none; border-left:6px solid;
  }
  .fb.show{ display:block; animation:pop .25s ease;}
  @keyframes pop{0%{transform:scale(.96);}100%{transform:scale(1);}}
  .fb.benar{ background:#dcfce7; border-color:var(--hijau); color:#166534;}
  .fb.coba{ background:#fef9c3; border-color:var(--kuning); color:#854d0e;}
  .fb.salah{ background:#fee2e2; border-color:var(--merah); color:#991b1b;}
  .fb .hint{ display:block; font-weight:500; margin-top:4px; color:#7c2d12;}

  .nav-row{ display:flex; justify-content:space-between; align-items:center; margin-top:6px; gap:10px;}
  .attempts-info{ font-size:.82rem; color:#64748b;}

  /* hasil */
  .hasil-hero{ text-align:center; }
  .hasil-hero .emoji{ font-size:3rem;}
  .skor-besar{
    font-size:2.6rem; font-weight:900; color:var(--hijau); margin:6px 0;
  }
  .recap{ margin-top:16px; }
  .recap-row{
    display:flex; justify-content:space-between; align-items:center; padding:9px 12px;
    border-bottom:1px solid #e2e8f0; font-size:.92rem;
  }
  .recap-row:last-child{ border-bottom:none;}
  .badge{
    font-size:.78rem; font-weight:800; padding:3px 10px; border-radius:999px; color:#fff;
  }
  .badge.b1{ background:var(--hijau);} .badge.b2{ background:var(--kuning); color:#7c2d12;}
  .badge.b0{ background:#94a3b8;}

  .siswa-tag{
    background:#eef2ff; border:1px solid #c7d2fe; color:#3730a3; border-radius:999px;
    padding:4px 14px; font-weight:600; font-size:.85rem; display:inline-block; margin-bottom:10px;
  }

  /* confetti */
  #confetti{ position:fixed; inset:0; pointer-events:none; z-index:9999;}
  .serpihan{ position:absolute; width:10px; height:14px; opacity:.95; border-radius:2px;}

  .small{ font-size:.82rem; color:#64748b;}
  .center{text-align:center;}
  .sembunyi{ display:none !important;}

  @media(max-width:560px){
    .cocok-grid{ grid-template-columns:1fr;}
    .card{ padding:18px;}
    h1.judul{ font-size:1.35rem;}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="judul">📐 Petualangan Sudut — Kuis Matematika Kelas 7</h1>
  <div class="subjudul">Petualangan seru menjelajah hubungan antar sudut! 🚀</div>

  <!-- ============== LAYAR IDENTITAS ============== -->
  <div id="layar-identitas" class="card">
    <div class="id-hero">
      <div class="emoji">🦸‍♂️🧭</div>
      <h2>Halo, Penjelajah Sudut!</h2>
      <p>Sebelum mulai, isi identitasmu dulu ya. Tulis nama dan pilih kelasmu.</p>
    </div>
    <div class="form-grup">
      <label for="in-nama">👤 Nama Lengkap</label>
      <input id="in-nama" type="text" placeholder="Contoh: Budi Santoso" autocomplete="off">
    </div>
    <div class="form-grup">
      <label for="in-kelas">🏫 Kelas</label>
      <select id="in-kelas">
        <option value="">— Pilih Kelas —</option>
        <option>7A</option><option>7B</option><option>7C</option><option>7D</option>
        <option>7E</option><option>7F</option><option>7G</option><option>7H</option>
      </select>
    </div>
    <div class="err-id" id="err-id"></div>
    <div class="center" style="margin-top:14px;">
      <button class="btn btn-hijau" id="btn-mulai">🌟 Mulai Petualangan!</button>
    </div>
  </div>

  <!-- ============== LAYAR KUIS ============== -->
  <div id="layar-kuis" class="sembunyi">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
        <span class="siswa-tag" id="tag-siswa">👤 —</span>
        <span class="small" id="skor-live">⭐ Skor: 0</span>
      </div>
      <div class="progress-wrap" style="margin-top:12px;"><div class="progress-bar" id="prog-bar"></div></div>
      <div class="progress-meta"><span id="prog-teks">Soal 1 dari 8</span><span id="prog-persen">0%</span></div>
    </div>

    <div class="card" id="konten-soal"></div>

    <div class="card">
      <div class="nav-row">
        <span class="attempts-info" id="info-attempts"></span>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-biru" id="btn-periksa">✅ Periksa Jawaban</button>
          <button class="btn btn-hijau" id="btn-next" disabled>Soal Berikutnya ➡️</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============== LAYAR HASIL ============== -->
  <div id="layar-hasil" class="card sembunyi">
    <div class="hasil-hero">
      <div class="emoji" id="hasil-emoji">🏆</div>
      <h2 id="hasil-judul" style="color:var(--biru-tua);">Petualangan Selesai!</h2>
      <div class="siswa-tag" id="hasil-siswa">—</div>
      <p class="small" id="hasil-teks">—</p>
      <div class="skor-besar" id="hasil-skor">0</div>
      <p class="small" id="hasil-maks">dari total 0 poin</p>
    </div>
    <div class="recap" id="recap-list"></div>
    <div class="center" style="margin-top:18px;">
      <button class="btn btn-ungu" id="btn-ulang">🔁 Ulangi Petualangan</button>
    </div>
  </div>
</div>

<canvas id="confetti"></canvas>

   DATA KUIS
   - setiap soal: judul, topik, svg, perintah, parts[]
   - tipe part: isian | pg | slider | bs | cocok

/* =========================================================
   STATE
   ========================================================= */
let siswa = {nama:'', kelas:''};
let idx = 0;                 // index soal saat ini
let partsState = [];         // state tiap part untuk soal saat ini
let skor = 0;                // total skor
let hasil = [];              // rekam hasil tiap soal {judul, status, poin}
let cocokState = null;       // state khusus matching

const POIN_PER_PART = 10;    // tiap part bernilai 10 poin maksimal

/* =========================================================
   ELEMEN
   ========================================================= */
const $ = id => document.getElementById(id);
const layarId = $('layar-identitas'), layarKuis = $('layar-kuis'), layarHasil = $('layar-hasil');
const konten = $('konten-soal');
const btnPeriksa = $('btn-periksa'), btnNext = $('btn-next');
const btnMulai = $('btn-mulai'), btnUlang = $('btn-ulang');

/* =========================================================
   MULAI
   ========================================================= */
btnMulai.onclick = () => {
  const nama = $('in-nama').value.trim();
  const kelas = $('in-kelas').value;
  const err = $('err-id');
  if(!nama || !kelas){
    err.textContent = "⚠️ Yuk isi nama dan pilih kelasmu dulu!";
    if(!nama) $('in-nama').focus();
    return;
  }
  err.textContent = '';
  siswa = {nama, kelas};
  $('tag-siswa').textContent = `👤 ${nama} — ${kelas}`;
  layarId.classList.add('sembunyi');
  layarKuis.classList.remove('sembunyi');
  idx = 0; skor = 0; hasil = [];
  tampilSoal();
};

btnUlang.onclick = () => {
  layarHasil.classList.add('sembunyi');
  layarId.classList.remove('sembunyi');
  $('in-nama').value = '';
  $('in-kelas').value = '';
};

/* =========================================================
   TAMPIL SOAL
   ========================================================= */
function tampilSoal(){
  const s = SOAL[idx];
  partsState = [];
  cocokState = null;
  $('prog-teks').textContent = `Soal ${idx+1} dari ${SOAL.length}`;
  const persen = Math.round(idx / SOAL.length * 100);
  $('prog-bar').style.width = persen + '%';
  $('prog-persen').textContent = persen + '%';

  let html = `<span class="soal-no">${s.judul}</span>
    <div class="soal-topik">${s.topik||''}</div>
    <div class="soal-perintah">${s.perintah}</div>
    ${s.img ? `<div class="figbox">${s.img}</div>` : ''}`;

  s.parts.forEach((p, i) => {
    html += `<div class="part" id="part-${i}">
      <div class="part-q"><span class="tag ${p.tipe}">${p.tag}</span>${p.tanya}</div>
      <div id="input-${i}">${renderInput(p, i)}</div>
      <div class="fb" id="fb-${i}"></div>
    </div>`;
  });

  konten.innerHTML = html;
  $('info-attempts').textContent = '';
  btnPeriksa.disabled = false;
  btnPeriksa.classList.remove('sembunyi');
  btnNext.disabled = true;
  btnNext.textContent = (idx === SOAL.length-1) ? '🏁 Lihat Hasil' : 'Soal Berikutnya ➡️';

  // inisialisasi state per part
  s.parts.forEach((p, i) => {
    partsState[i] = { attempts:0, settled:false, benar:false, value:null, poin:0 };
  });

  // pasang event listener
  s.parts.forEach((p, i) => {
    if(p.tipe === 'pg') wirePG(i);
    else if(p.tipe === 'bs') wireBS(i);
    else if(p.tipe === 'isian') wireIsian(i);
    else if(p.tipe === 'slider') wireSlider(i);
    else if(p.tipe === 'cocok') wireCocok(i);
  });

  if(s.parts.length === 1 && s.parts[0].tipe === 'cocok'){
    btnPeriksa.textContent = '✅ Periksa Pencocokan';
  } else {
    btnPeriksa.textContent = '✅ Periksa Jawaban';
  }
}

/* =========================================================
   RENDER INPUT per tipe
   ========================================================= */
function renderInput(p, i){
  if(p.tipe === 'isian'){
    return `<input class="isian-in" id="isi-${i}" type="number" inputmode="numeric" placeholder="...">
      <span class="satuan">${p.satuan||'°'}</span>`;
  }
  if(p.tipe === 'pg'){
    return `<div class="opsi">${p.opsi.map((o,j)=>
      `<label id="lbl-${i}-${j}"><input type="radio" name="pg-${i}" value="${o}">
        <span>${o}${p.satuan||'°'}</span></label>`).join('')}</div>`;
  }
  if(p.tipe === 'slider'){
    return `<div class="slider-wrap">
      <input type="range" id="sl-${i}" min="${p.min}" max="${p.max}" value="${p.min}" step="1">
      <span class="slider-val" id="slv-${i}">${p.min}</span>
      <span class="small">Geser ke nilai x yang kamu pikir benar</span>
    </div>`;
  }
  if(p.tipe === 'bs'){
    return `<div class="bs-wrap">
      <button class="bs-btn" id="bs-${i}-B" data-v="Benar">✅ Benar</button>
      <button class="bs-btn" id="bs-${i}-S" data-v="Salah">❌ Salah</button>
    </div>`;
  }
  if(p.tipe === 'cocok'){
    const kiri = p.pasangan.map((pp,j)=>`<div class="cocok-item" data-side="kiri" data-i="${j}" id="ck-${j}">${pp[0]}</div>`).join('');
    // definisi diacak
    const kananAcak = acak(p.pasangan.map((pp,j)=>({t:pp[1], j})));
    cocokState = { selectedKiri:null, pasangan:p.pasangan, terkunci:Array(p.pasangan.length).fill(null), mapping:{} };
    const kanan = kananAcak.map((d,k)=>`<div class="cocok-item" data-side="kanan" data-j="${d.j}" id="cd-${k}">${d.t}</div>`).join('');
    cocokState._kananOrder = kananAcak; // simpan urutan tampil
    return `<div class="cocok-grid">
      <div class="cocok-col"><h4>Istilah</h4>${kiri}</div>
      <div class="cocok-col"><h4>Definisi</h4>${kanan}</div>
    </div>
    <div class="cocok-status" id="cocok-status">Klik istilah, lalu klik definisi yang cocok. Pasangan benar akan terkunci hijau.</div>`;
  }
  return '';
}

function acak(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

/* =========================================================
   WIRE input
   ========================================================= */
function wirePG(i){
  document.querySelectorAll(`input[name="pg-${i}"]`).forEach(r=>{
    r.addEventListener('change', ()=>{
      document.querySelectorAll(`#input-${i} .opsi label`).forEach(l=>l.classList.remove('terpilih'));
      r.closest('label').classList.add('terpilih');
      partsState[i].value = parseFloat(r.value);
    });
  });
}

function wireBS(i){
  ['B','S'].forEach(s=>{
    const b = $(`bs-${i}-${s}`);
    b.addEventListener('click', ()=>{
      if(partsState[i].settled) return;
      document.querySelectorAll(`#input-${i} .bs-btn`).forEach(x=>x.classList.remove('terpilih'));
      b.classList.add('terpilih');
      partsState[i].value = b.dataset.v;
    });
  });
}
function wireIsian(i){
  $('isi-'+i).addEventListener('input', e=>{
    partsState[i].value = e.target.value;
  });
}
function wireSlider(i){
  const sl = $('sl-'+i), slv=$('slv-'+i);
  sl.addEventListener('input', ()=>{
    slv.textContent = sl.value;
    partsState[i].value = parseFloat(sl.value);
  });
  partsState[i].value = parseFloat(sl.value);
}
function wireCocok(i){
  // klik istilah (kiri)
  document.querySelectorAll(`#input-${i} .cocok-item[data-side="kiri"]`).forEach(el=>{
    el.addEventListener('click', ()=>{
      if(cocokState.terkunci[+el.dataset.i] !== null) return; // sudah terkunci
      document.querySelectorAll(`#input-${i} .cocok-item[data-side="kiri"]`).forEach(x=>x.classList.remove('sel-kiri'));
      el.classList.add('sel-kiri');
      cocokState.selectedKiri = +el.dataset.i;
    });
  });
  // klik definisi (kanan)
  document.querySelectorAll(`#input-${i} .cocok-item[data-side="kanan"]`).forEach(el=>{
    el.addEventListener('click', ()=>{
      if(cocokState.selectedKiri === null) return;
      // jika definisi sudah terkunci, abaikan
      if(el.classList.contains('terkunci-benar') || el.classList.contains('terkunci-salah')) return;
      const ki = cocokState.selectedKiri;
      const benar = (+el.dataset.j === ki);
      // tampilkan pasangan: kunci kedua elemen
      const elKiri = document.querySelector(`#input-${i} .cocok-item[data-side="kiri"][data-i="${ki}"]`);
      if(benar){
        elKiri.classList.add('terkunci-benar'); elKiri.classList.remove('sel-kiri');
        el.classList.add('terkunci-benar');
        cocokState.terkunci[ki] = true;
        cocokState.mapping[ki] = true;
      } else {
        // salah: beri kesempatan (tidak terkunci permanen), beri tanda merah sebentar
        el.classList.add('terkunci-salah');
        elKiri.classList.remove('sel-kiri');
        setTimeout(()=>{ el.classList.remove('terkunci-salah'); }, 700);
      }
      cocokState.selectedKiri = null;
      updateCocokStatus(i);
    });
  });
}
function updateCocokStatus(i){
  const total = cocokState.pasangan.length;
  const benar = cocokState.terkunci.filter(Boolean).length;
  $('cocok-status').textContent = `Pasangan benar: ${benar} dari ${total}. ${benar<total?'Lanjut mencocokkan ya!':'Semua terpasang! 🎉'}`;
}

/* =========================================================
   PERIKSA
   ========================================================= */
btnPeriksa.onclick = () => {
  const s = SOAL[idx];
  let semuaSettled = true;
  let adaAksi = false;

  s.parts.forEach((p, i) => {
    const st = partsState[i];
    if(st.settled) return;

    // cocok ditangani terpisah (auto-kunci)
    if(p.tipe === 'cocok'){
      const benar = cocokState.terkunci.filter(Boolean).length;
      const total = cocokState.pasangan.length;
      if(benar === total){
        st.settled = true; st.benar = true; st.poin = POIN_PER_PART;
        tampilFB(i, 'benar', acakPesan(['Hebat! 🎉 Semua pasangan tepat!','Pintar! 🌟 Kamu jago istilah sudut!']));
        kunciPart(i);
      } else {
        tampilFB(i, 'coba', `Belum semua pasangan benar. Terpasang: ${benar}/${total}. Lanjutkan mencocokkan! 💡`);
        semuaSettled = false;
      }
      return;
    }

    // validasi input terisi
    if(st.value === null || st.value === '' || (typeof st.value==='number' && isNaN(st.value))){
      tampilFB(i, 'coba', 'Yuk pilih/masukkan jawaban dulu ya! 🙂');
      semuaSettled = false;
      return;
    }

    st.attempts++;
    const benar = cekJawaban(p, st.value);

    if(benar){
      st.settled = true; st.benar = true;
      st.poin = (st.attempts === 1) ? POIN_PER_PART : Math.round(POIN_PER_PART/2); // benar percobaan 1 = 10, percobaan 2 = 5
      tampilFB(i, 'benar',
        (st.attempts===1 ? acakPesan(['Hebat! 🎉 Tepat sekali!','Mantap! ⭐ Kamu pintar!','Keren! 🚀 Otakmu cemerlang!','Jenius! 🧠 Lanjut!'])
                         : acakPesan(['Yes! 💪 Akhirnya benar! Tetap semangat!','Bagus! 🌟 Kamu tidak menyerah!']))
        + ` <span class="hint">${p.explain}</span>`
      );
      kunciPart(i);
      adaAksi = true;
    } else {
      if(st.attempts >= 2){
        // kesempatan habis → beri jawaban + penjelasan, tetap boleh lanjut
        st.settled = true; st.benar = false; st.poin = 0;
        const jw = jawabanDisplay(p);
        tampilFB(i, 'salah',
          `Yah, belum beruntung kali ini 😢 Jawaban yang benar: <b>${jw}</b>. ` +
          `<span class="hint">${p.explain}</span> Tenang, ini bagian dari belajar! Ayo lanjut 🚀`
        );
        kunciPart(i);
        adaAksi = true;
      } else {
        // masih ada 1 kesempatan ulang
        tampilFB(i, 'coba',
          `Belum tepat 😊 Kamu masih punya <b>1 kali kesempatan mengulang</b>! ` +
          `<span class="hint">💡 Petunjuk: ${p.hint}</span>`
        );
        semuaSettled = false;
      }
    }
  });

  // update info attempts
  const sisaRetry = partsState.filter(st=>!st.settled).length;
  $('info-attempts').textContent = sisaRetry>0 ? 'Masih ada bagian yang harus diselesaikan dulu ya.' : 'Bagian soal ini sudah selesai. ✅';

  // hitung ulang skor live
  hitungSkorLive();

  if(semuaSettled && partsState.every(st=>st.settled)){
    btnNext.disabled = false;
    btnPeriksa.disabled = true;
    // penguatan akhir soal
    const semuaBenar = partsState.every(st=>st.benar);
    if(semuaBenar){
      confettiBurst();
    }
  }
};

function cekJawaban(p, val){
  if(p.tipe === 'isian' || p.tipe === 'slider'){
    const v = parseFloat(val);
    return Math.abs(v - p.jawaban) <= (p.tol||0);
  }
  if(p.tipe === 'pg'){
    return parseFloat(val) === p.jawaban;
  }
  if(p.tipe === 'bs'){
    return val === p.jawaban;
  }
  return false;
}
function jawabanDisplay(p){
  if(p.tipe==='isian'||p.tipe==='slider') return p.jawaban + '°';
  if(p.tipe==='pg') return p.jawaban + '°';
  if(p.tipe==='bs') return p.jawaban;
  return '';
}
function tampilFB(i, jenis, html){
  const fb = $('fb-'+i);
  fb.className = 'fb show ' + jenis;
  fb.innerHTML = html;
}
function kunciPart(i){
  // kunci input agar tidak diubah lagi
  const p = SOAL[idx].parts[i];
  if(p.tipe==='pg'){
    document.querySelectorAll(`input[name="pg-${i}"]`).forEach(r=>r.disabled=true);
    document.querySelectorAll(`#input-${i} .opsi label`).forEach(l=>l.classList.add('blok'));
  } else if(p.tipe==='bs'){
    document.querySelectorAll(`#input-${i} .bs-btn`).forEach(b=>b.classList.add('blok'));
  } else if(p.tipe==='isian'){
    const el=$('isi-'+i); if(el) el.disabled=true;
  } else if(p.tipe==='slider'){
    const el=$('sl-'+i); if(el) el.disabled=true;
  }
}

function acakPesan(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function hitungSkorLive(){
  // hanya memperbarui tampilan skor live (akumulasi skor dilakukan di btnNext).
  // JANGAN reset hasil di sini.
  $('skor-live').textContent = `⭐ Skor: ${skor}`;
}

/* =========================================================
   NEXT
   ========================================================= */
btnNext.onclick = () => {
  // simpan hasil soal ini
  const s = SOAL[idx];
  const poinSoal = partsState.reduce((a,st)=>a+st.poin,0);
  skor += poinSoal;
  const benarSemua = partsState.every(st=>st.benar);
  const adaBantuan = partsState.some(st=>!st.benar);
  let status = benarSemua ? 'sempurna' : (adaBantuan ? 'dibantu' : 'sempurna');
  // lebih akurat: jika semua benar & semua attempt 1 => sempurna; jika benar tapi ada retry => sebagian; jika ada salah => dibantu
  const adaRetry = partsState.some(st=>st.benar && st.attempts>1);
  if(benarSemua && !adaRetry) status='sempurna';
  else if(benarSemua && adaRetry) status='sebagian';
  else status='dibantu';
  hasil.push({judul:s.judul, status, poin:poinSoal, maks:s.parts.length*POIN_PER_PART});
  $('skor-live').textContent = `⭐ Skor: ${skor}`;

  idx++;
  if(idx >= SOAL.length){
    tampilHasil();
  } else {
    tampilSoal();
  }
};

/* =========================================================
   HASIL
   ========================================================= */
function tampilHasil(){
  layarKuis.classList.add('sembunyi');
  layarHasil.classList.remove('sembunyi');
  const maks = SOAL.reduce((a,s)=>a+s.parts.length*POIN_PER_PART,0);
  $('hasil-siswa').textContent = `👤 ${siswa.nama} — ${siswa.kelas}`;
  $('hasil-skor').textContent = `${skor} / ${maks}`;
  $('hasil-maks').textContent = `dari total ${maks} poin`;
  const persen = Math.round(skor/maks*100);
  let emoji='🏆', judul='Petualangan Selesai!', teks='';
  if(persen===100){ emoji='🏆🎉'; judul='SEMPURNA! Kamu Maestro Sudut!'; teks='Wah, semua jawaban tepat di percobaan pertama! Luar biasa!'; confettiBurst(); setTimeout(confettiBurst,500); setTimeout(confettiBurst,1000);}
  else if(persen>=75){ emoji='🌟'; judul='Hebat Sekali!'; teks='Kamu menguasai hubungan sudut dengan baik. Sedikit lagi menuju sempurna!'; confettiBurst();}
  else if(persen>=50){ emoji='💪'; judul='Bagus, Terus Semangat!'; teks='Kamu sudah mulai paham. Yuk ulangi agar makin lancar!'; }
  else { emoji='📚'; judul='Tetap Semangat, Ya!'; teks='Belajar itu proses. Coba ulangi petualangan ini, kamu pasti makin pintar!'; }
  $('hasil-emoji').textContent = emoji;
  $('hasil-judul').textContent = judul;
  $('hasil-teks').textContent = teks;

  // recap
  let html='';
  hasil.forEach(h=>{
    const cls = h.status==='sempurna'?'b1':(h.status==='sebagian'?'b2':'b0');
    const ket = h.status==='sempurna'?'Sempurna':(h.status==='sebagian'?'Benar (dgn ulang)':'Dibantu');
    html += `<div class="recap-row"><span>${h.judul}</span>
      <span><span class="badge ${cls}">${ket}</span> &nbsp; ${h.poin}/${h.maks} poin</span></div>`;
  });
  $('recap-list').innerHTML = html;
}

/* =========================================================
   CONFETTI
   ========================================================= */
const canvas = $('confetti');
const ctx = canvas.getContext('2d');
let serpihan = [];
function resizeCanvas(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resizeCanvas); resizeCanvas();

function confettiBurst(){
  const warna = ['#f43f5e','#f59e0b','#10b981','#3b82f6','#8b5cf6','#ec4899','#06b6d4'];
  for(let i=0;i<80;i++){
    serpihan.push({
      x: canvas.width/2 + (Math.random()-0.5)*200,
      y: canvas.height/2,
      vx:(Math.random()-0.5)*8,
      vy: Math.random()*-8 - 3,
      g: 0.25,
      rot: Math.random()*Math.PI,
      vr:(Math.random()-0.5)*0.3,
      size: 6+Math.random()*7,
      c: warna[Math.floor(Math.random()*warna.length)],
      life: 0, maxLife: 90+Math.random()*40
    });
  }
  if(!animConfettiOn){ animConfettiOn=true; requestAnimationFrame(animConfetti); }
}
let animConfettiOn=false;
function animConfetti(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  serpihan.forEach(s=>{
    s.vy += s.g; s.x += s.vx; s.y += s.vy; s.rot += s.vr; s.life++;
    ctx.save(); ctx.translate(s.x,s.y); ctx.rotate(s.rot);
    ctx.fillStyle = s.c; ctx.globalAlpha = Math.max(0, 1 - s.life/s.maxLife);
    ctx.fillRect(-s.size/2, -s.size/2, s.size, s.size*1.4);
    ctx.restore();
  });
  serpihan = serpihan.filter(s=>s.life < s.maxLife && s.y < canvas.height+40);
  if(serpihan.length>0){ requestAnimationFrame(animConfetti); }
  else { animConfettiOn=false; ctx.clearRect(0,0,canvas.width,canvas.height); }
}

/* =========================================================
   INPUT ENTER -> periksa
   ========================================================= */
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && !layarKuis.classList.contains('sembunyi') && !btnPeriksa.disabled){
    btnPeriksa.click();
  }
});
